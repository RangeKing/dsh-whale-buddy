<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Whale Buddy — 会话联动预览</title>
<style>
body { margin:0; font:13px/1.5 system-ui,sans-serif; background:#f5f6f8; color:#0f1115;
 --dsw-alias-bg-base:#fff; --dsw-alias-bg-layer-2:#fff; --dsw-alias-bg-layer-3:#fff;
 --dsw-alias-button-floating-fill:#fff; --dsw-alias-button-ghost-active-fill:#ebeef2;
 --dsw-alias-label-primary:#0f1115; --dsw-alias-label-secondary:#61666b; --dsw-alias-label-tertiary:#81858c;
 --dsw-alias-label-caption:#adb2b8; --dsw-alias-label-primary-foreground:#fff; --dsw-alias-brand-primary:#0f1115;
 --dsw-alias-border-l2:#0000001a; --dsw-alias-border-l3:#0000001f; --dsw-alias-border-l4:#00000029;
 --dsw-alias-interactive-bg-hover:#2631480f;
}
body[data-ds-dark-theme] { background:#151517; color:#f9fafb;
 --dsw-alias-bg-base:#151517; --dsw-alias-bg-layer-2:#2c2c2e; --dsw-alias-bg-layer-3:#2c2c2e;
 --dsw-alias-button-floating-fill:#2c2c2e; --dsw-alias-button-ghost-active-fill:#43454a;
 --dsw-alias-label-primary:#f9fafb; --dsw-alias-label-secondary:#cfd3d6; --dsw-alias-label-tertiary:#adb2b8;
 --dsw-alias-label-caption:#81858c; --dsw-alias-label-primary-foreground:#0f1115; --dsw-alias-brand-primary:#f9fafb;
 --dsw-alias-border-l2:#ffffff1f; --dsw-alias-border-l3:#ffffff29; --dsw-alias-border-l4:#ffffff33;
 --dsw-alias-interactive-bg-hover:#ffffff14;
}
header {padding:20px 24px; display:flex; align-items:center; flex-wrap:wrap; gap:12px; border-bottom:1px solid var(--dsw-alias-border-l2)}
h1 {font-size:15px; margin:0; font-weight:500} header small{color:var(--dsw-alias-label-tertiary)}
select {font:inherit; padding:6px; color:inherit; background:var(--dsw-alias-bg-layer-3); border:1px solid var(--dsw-alias-border-l3); border-radius:8px}
main {position:relative; height:calc(100dvh - 88px); min-height:440px; background:var(--dsw-alias-bg-base)}
.conversation {padding:44px 24px; max-width:580px; margin:auto} .prompt {padding:12px 16px; border-radius:14px; background:var(--dsw-alias-interactive-bg-hover); margin-bottom:32px}
[data-turn-process] {font:inherit;color:var(--dsw-alias-label-secondary);background:none;border:0;padding:4px;}
.hidden {position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.composer {position:absolute;bottom:24px;left:24px;right:24px;max-width:580px;margin:auto;display:grid;gap:10px}
textarea {box-sizing:border-box;resize:none;width:100%;height:94px;border:1px solid var(--dsw-alias-border-l3);border-radius:16px;padding:16px;background:var(--dsw-alias-bg-layer-3);color:inherit;font:inherit}
</style></head><body>
<header><h1>会话联动预览</h1><label>模拟任务 <select id="activity"><option value="reading">读取文件</option><option value="editing">编辑文件</option><option value="searching">联网搜索</option><option value="responding">作答</option><option value="thinking">思考</option><option value="idle">结束回合</option></select></label><small>生产插件 · 模拟 DSH 信号</small></header>
<main><div class="conversation"><div class="prompt">帮我阅读项目文件，并整理需要修改的内容。</div><span class="hidden" role="status">深度求索中</span><button data-turn-process="1"><span>深度求索中，用时3秒</span></button></div><div id="mount"></div></main>
<script src="../node_modules/react/umd/react.development.js"></script><script src="../node_modules/react-dom/umd/react-dom.development.js"></script>
<script>window.__ModuleLoader__={load({factory}){window.api=factory(id=>{if(id==='react')return React;throw Error(id)})}}</script>
<script src="../lib/client.js"></script>
<script>
const params = new URLSearchParams(location.search)
if(params.get('theme')==='dark')document.body.setAttribute('data-ds-dark-theme','')
const entries = new Map(), t = api.fallbackTranslate('zh')
const ctx = {effect:fn=>fn(),locale:{register:()=>()=>{},bind:()=>t},slots:{inject:(_,fn)=>fn(),register:(opts,component)=>{entries.set(opts.name,{component,...opts.inject()});return ()=>{}}}}
const dispose = api.apply(ctx), store = entries.get('shell.overlay').store
store.setConfig('inlineEnabled',true);store.setConfig('dockEnabled',true);store.setConfig('classicStatus',params.get('classic')==='1')
let activity='reading'; const root=ReactDOM.createRoot(document.getElementById('mount'))
function render(){
 const running=activity!=='idle', tool={reading:'fs_read',editing:'fs_write',searching:'web_search'}[activity]
 const props={sessionId:'demo',useSession:fn=>fn({running}),useChat:fn=>fn({legacy:{runningCalls:tool?[{name:tool}]:[],partial:activity==='responding'?'answer':null,turnTimings:new Map()}}),useSessionStatus:fn=>fn(new Map()),useSessions:fn=>fn({byId:{}})}
 const entry=name=>{const e=entries.get(name);return React.createElement(e.component,{...props,store,t,key:name})}
 root.render(React.createElement(React.Fragment,null,entry('conversation.input.overlay'),entry('shell.overlay'),React.createElement('div',{className:'composer'},entry('conversation.input.dock'),React.createElement('textarea',{placeholder:'发送消息…',readOnly:true,'aria-label':'消息输入框（预览）'}))))
}
render()
document.getElementById('activity').addEventListener('change',e=>{activity=e.target.value;render()})
window.addEventListener('pagehide',()=>{root.unmount();dispose()},{once:true})
</script></body></html>
